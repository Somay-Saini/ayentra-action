[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ayentra"
version = "0.1.0"
description = "Invariant-aware verification gate with property-based shrinking, deterministic concurrency checks, and sandbox patch verification."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Ayentra", email = "support@ayentra.dev" }
]
keywords = [
    "verification",
    "invariants",
    "concurrency",
    "race-conditions",
    "property-testing",
    "hypothesis",
    "auto-repair",
    "testing"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "hypothesis>=6.0.0",
    "pytest>=7.0.0",
    "rich>=13.0.0",
]

[project.urls]
Homepage = "https://ayentra.dev"
Documentation = "https://github.com/ayentra/ayentra#readme"
Repository = "https://github.com/ayentra/ayentra.git"
"Issue Tracker" = "https://github.com/ayentra/ayentra/issues"
Changelog = "https://github.com/ayentra/ayentra/blob/main/CHANGELOG.md"

[project.scripts]
ayentra = "ayentra.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ayentra = ["site/*", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["examples", "tests"]
python_files = ["test_*.py"]
